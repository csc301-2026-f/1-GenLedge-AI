[pytest]
# The whole backend suite lives here. With `testpaths` set, `python -m pytest` from
# the repository root discovers it without being told where to look, and the plain
# `python -m pytest tests` form keeps working from `src/backend/`.
testpaths = src/backend/tests

# Make `app` and the `tests` package importable no matter which directory pytest is
# started from. `src/backend/conftest.py` does this too, so a run from inside
# `src/backend` behaves identically; doing it here as well means a root-level run
# does not depend on collection order.
pythonpath = src/backend

# No network-dependent or opt-in suites exist in this repository yet. When the eval
# layer from `plans/LANGGRAPH_HARNESS_PLAN.md` §11.1 lands it must be excluded here,
# because it needs a real provider.
addopts = -q
